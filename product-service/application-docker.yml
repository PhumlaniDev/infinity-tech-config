server:
  port: 9400

spring:
  application:
    name: product-service

  config:
    activate:
      on-profile: docker

  # ----- MongoDB--------------------------
  data:
    mongodb:
      uri: mongodb://mongo:27017/product_db
      auto-index-creation: false
      username: product_user
      password: product_pass

    # ----- Redis--------------------------
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2

  # ----- Cache--------------------------
  cache:
    type: redis

  # ----- Kafka--------------------------
  kafka:
    bootstrap-servers: kafka:9092

    consumer:
      group-id: product-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.phumlanidev.commonevents.events"
        spring.json.use.type.headers: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    listener:
      concurrency: 3
      ack-mode: manual

    retry:
      topic:
        enabled: true

  # ----- Security--------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/ecommerce
          jwk-uri: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs

# ----- Eureka--------------------------
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

# ----- Keycloak--------------------------
keycloak:
  auth-server-url: http://keycloak:8080
  realm: ecommerce
  resource: product-service
  principle-attribute: preferred_username
  credentials:
    secret: "{cipher}bce5d09009e581ac72c43de760c74be7bd127d01c5edb0254a5c6a6904a0511b5019b4290263d0b3c5cb4399163d2478cfe81638355d0d375f1522d9bbcb6b50"
  admin:
    username: "{cipher}1b1605dd29d70df25c643ed64a28779456c1453c2252432b3a77e77ae35935d0"
    password: "{cipher}9691f299e5d13785d56be58db20a811fbea1b1b8469c6d0b7dfb2040be6eac09"

# ----- Actuator & Metrics--------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ----- Logging--------------------------
logging:
  level:
    # Set your application's log level
    com.phumlanidev.productservice: DEBUG

    # Reduce Hibernate verbosity
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

    # Reduce Spring Boot and AMQP noise
    org.springframework.boot.context.config: INFO
    org.springframework.amqp: INFO
    org.springframework.cloud.stream: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.springframework.http.converter.json: INFO
    org.springframework.validation: INFO

# ----- Product-specific--------------------------
product:
  cache:
    ttl: 3600 # Time-to-live for product cache in seconds