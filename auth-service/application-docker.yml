server:
  port: 9100

spring:
  application:
    name: auth-service
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://auth-service-db:5432/auth_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5       # Keep low to avoid exhausting local DB connections
      minimum-idle: 2            # Few idle connections are enough
      idle-timeout: 30000        # 30 sec before closing idle connections
      max-lifetime: 1800000      # 30 minutes
      connection-timeout: 10000  # 10 seconds max wait for a connection
      pool-name: DevHikariCP
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/ecommerce
  cache:
    type: caffeine

keycloak:
  auth-server-url: http://keycloak:8080
  realm: ecommerce
  resource: auth-service
  principle-attribute: preferred_username
  credentials:
    secret: "{cipher}3f8de3f302e665d8de5b26b15998f677b7216c657ef4f6939906f64d7ad6d19a96a60bd28e40cfec55da4df4d860f7d299d31f85b6df6acdad5fb7f7273c881d8ed258ef41826c53c8529da75a03254ed4cb4f6673c5d918a9777d5259cc37f4abe6762151396c39b778089189bbc87d"
  admin:
    username: "{cipher}1b1605dd29d70df25c643ed64a28779456c1453c2252432b3a77e77ae35935d0"
    password: "{cipher}9691f299e5d13785d56be58db20a811fbea1b1b8469c6d0b7dfb2040be6eac09"
  logout_uri: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/logout

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.phumlanidev.authservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    #    org.springframework.web: DEBUG
    org.springframework.http.converter.json: DEBUG
    org.springframework.validation: DEBUG