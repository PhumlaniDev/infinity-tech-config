server:
  port: 8085

spring:
  application:
    name: api-gateway
  config:
    activate:
      on-profile: dev
  main:
    web-application-type: reactive

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            httpclient:
              connect-timeout: 5000
              response-timeout: 30s

            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaderS: "*"
                allowCredentials: true
                maxAge: 3600

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            # Cart service
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**

            # Inventory services
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**

            # Notification service
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

            # Order service
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/order/**

            # Payment service
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

            # Product public reads
            - id: product-service-public
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/all,/api/v1/products/*/price

            # Product secured write
            - id: product-service-secured
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            # Stripe Webhook
            - id: stripe-webhook
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/webhook/stripe

    config:
      uri: http://config-server:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://localhost:8080/realms/ecommerce
          jwk-set-uri: https://localhost:8080/realms/ecommerce/protocol/openid-connect/certs
keycloak:
  principle-attribute: preferred_username

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.phumlanidev.apigateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG