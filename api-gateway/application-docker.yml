server:
  port: 8085

spring:
  application:
    name: api-gateway
  config:
    activate:
      on-profile: docker
  main:
    web-application-type: reactive

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            httpclient:
              connect-timeout: 3000
              response-timeout: 20s

            default-filters:
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenish-rate: 5
                  redis-rate-limiter.burst-capacity: 10
                  redis-rate-limiter.requestedTokens: 1
                  key-resolver: "#{@ipKeyResolver}"

            corsConfigurations:
              '[/**]':
                allowedOrigins: "${FRONTEND_URL}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaderS: "*"
                allowCredentials: true
                maxAge: 3600

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            # Cart service
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**

            # Inventory services
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**

            # Notification service
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - RemoveRequestHeader=Cookie

            # Order service
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/order/**
              filters:
                - RemoveRequestHeader=Cookie

            # Payment service
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - RemoveRequestHeader=Cookie
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userIdKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

            # Product public reads
            - id: product-service-public
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/all,/api/v1/products/*/price

            # Product secured write
            - id: product-service-secured
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            # Stripe Webhook
            - id: stripe-webhook
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/webhook/stripe

    config:
      uri: http://config-server:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${KEYCLOAK_HOST}/realms/ecommerce
          jwk-set-uri: https://${KEYCLOAK_HOST}/realms/ecommerce/protocol/openid-connect/certs
keycloak:
  principle-attribute: preferred_username

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      endpoint: http://${OBSERVABILITY_HOST}:${OBSERVABILITY_PORT}/api/v2/spans

logging:
  level:
    com.phumlanidev.apigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO